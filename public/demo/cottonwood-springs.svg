<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stylized illustration of Cottonwood Springs, a fictional town">
  <!-- Cottonwood Springs — fictional demo community. Drawn in the Pattern
       Language brand palette so it reads as illustration, not photograph. -->
  <rect width="800" height="600" fill="#fdfbf7"/>

  <!-- sun -->
  <circle cx="620" cy="130" r="58" fill="none" stroke="#e8b4a0" stroke-width="3"/>
  <circle cx="620" cy="130" r="40" fill="#e8b4a0" opacity="0.25"/>

  <!-- far ridge -->
  <path d="M0 300 L120 220 L230 290 L330 210 L450 300 L560 240 L680 300 L800 250 L800 600 L0 600 Z"
        fill="#c9b8e8" opacity="0.35"/>
  <!-- near foothills -->
  <path d="M0 360 L90 300 L200 355 L320 285 L430 360 L570 300 L690 360 L800 320 L800 600 L0 600 Z"
        fill="#b8d4c8" opacity="0.5"/>

  <!-- valley floor -->
  <rect y="420" width="800" height="180" fill="#f8f6f2"/>

  <!-- river -->
  <path d="M-10 555 C 140 530, 240 575, 400 552 C 560 530, 660 570, 810 545"
        fill="none" stroke="#b8d4c8" stroke-width="10" opacity="0.8"/>
  <path d="M-10 566 C 140 542, 240 586, 400 563 C 560 542, 660 581, 810 556"
        fill="none" stroke="#c9b8e8" stroke-width="3" opacity="0.5"/>

  <!-- main street block -->
  <g>
    <!-- the former department store: tallest, quietly vacant -->
    <rect x="332" y="330" width="118" height="112" fill="#e0ded9"/>
    <rect x="332" y="330" width="118" height="16" fill="#d47b5f"/>
    <rect x="348" y="362" width="20" height="24" fill="#fdfbf7"/>
    <rect x="382" y="362" width="20" height="24" fill="#fdfbf7"/>
    <rect x="416" y="362" width="20" height="24" fill="#fdfbf7"/>
    <rect x="348" y="400" width="88" height="30" fill="#fdfbf7"/>
    <line x1="348" y1="400" x2="436" y2="430" stroke="#d8d8d8" stroke-width="2"/>
    <line x1="436" y1="400" x2="348" y2="430" stroke="#d8d8d8" stroke-width="2"/>

    <rect x="180" y="368" width="70" height="74" fill="#e8b4a0"/>
    <rect x="194" y="384" width="18" height="20" fill="#fdfbf7"/>
    <rect x="222" y="384" width="18" height="20" fill="#fdfbf7"/>
    <rect x="196" y="414" width="38" height="28" fill="#fdfbf7"/>

    <rect x="258" y="352" width="66" height="90" fill="#b8d4c8"/>
    <rect x="258" y="352" width="66" height="12" fill="#2a2a2a" opacity="0.85"/>
    <rect x="272" y="376" width="16" height="18" fill="#fdfbf7"/>
    <rect x="296" y="376" width="16" height="18" fill="#fdfbf7"/>
    <rect x="274" y="408" width="34" height="34" fill="#fdfbf7"/>

    <rect x="458" y="360" width="64" height="82" fill="#c9b8e8"/>
    <rect x="470" y="378" width="16" height="18" fill="#fdfbf7"/>
    <rect x="494" y="378" width="16" height="18" fill="#fdfbf7"/>
    <rect x="472" y="408" width="36" height="34" fill="#fdfbf7"/>

    <rect x="530" y="374" width="72" height="68" fill="#e8b4a0" opacity="0.8"/>
    <rect x="544" y="390" width="18" height="18" fill="#fdfbf7"/>
    <rect x="572" y="390" width="18" height="18" fill="#fdfbf7"/>
    <rect x="546" y="416" width="40" height="26" fill="#fdfbf7"/>
  </g>

  <!-- street line -->
  <line x1="0" y1="442" x2="800" y2="442" stroke="#2a2a2a" stroke-width="2" opacity="0.35"/>

  <!-- cottonwood tree -->
  <g>
    <rect x="106" y="376" width="10" height="66" fill="#2a2a2a" opacity="0.7"/>
    <path d="M111 384 L92 356 M111 396 L132 362" stroke="#2a2a2a" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
    <circle cx="86" cy="340" r="34" fill="#b8d4c8"/>
    <circle cx="130" cy="326" r="40" fill="#b8d4c8" opacity="0.9"/>
    <circle cx="110" cy="356" r="30" fill="#c9b8e8" opacity="0.6"/>
    <!-- drifting cottonwood seeds -->
    <circle cx="175" cy="300" r="4" fill="#fdfbf7" stroke="#d8d8d8"/>
    <circle cx="200" cy="272" r="3" fill="#fdfbf7" stroke="#d8d8d8"/>
    <circle cx="226" cy="292" r="3.5" fill="#fdfbf7" stroke="#d8d8d8"/>
  </g>

  <!-- tri-accent baseline, the brand signature -->
  <rect x="0" y="594" width="800" height="6" fill="#e8b4a0"/>
  <rect x="266" y="594" width="267" height="6" fill="#b8d4c8"/>
  <rect x="533" y="594" width="267" height="6" fill="#c9b8e8"/>
</svg>
